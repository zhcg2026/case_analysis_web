# RECOVERY REFERENCE ONLY. Do not run against the healthy production container.
# No build/pull/install steps. A verified image must be supplied explicitly.
# Historical empty models.py/models_init.py directory mounts are preserved, not silently removed.
version: '3.8'
services:
  case-analysis-app:
    container_name: case-analysis-web
    image: ${CASE_ANALYSIS_RECOVERY_IMAGE:?Set a verified recovery image containing
      current runtime dependencies; do not use the old base image blindly}
    command:
    - gunicorn
    - --bind
    - 0.0.0.0:5000
    - --workers
    - '4'
    - --worker-class
    - gthread
    - --threads
    - '4'
    - --timeout
    - '300'
    - --graceful-timeout
    - '60'
    - backend.app:app
    working_dir: /app
    env_file:
    - /home/ubuntu/case_analysis_web/.env.production
    environment:
      DB_NAME: case_analysis
      DB_HOST: mysql-case-analysis
      DB_PORT: '3306'
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_EMBED_MODEL: EntropyYue/jina-embeddings-v2-base-zh
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: '19530'
      PYTHONPATH: /app/backend:/app
      FLASK_ENV: production
      FLASK_APP: backend/app.py
      USE_LOCAL_MODE: 'false'
      MILVUS_COLLECTION: unified_kb
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
    ports:
    - 5001:5000
    volumes:
    - type: bind
      source: /home/ubuntu/case_analysis_web/backend/analysis_routes.py
      target: /app/backend/analysis_routes.py
      read_only: false
      bind:
        propagation: rprivate
    - type: bind
      source: /home/ubuntu/case_analysis_web/backend/app.py
      target: /app/backend/app.py
      read_only: false
      bind:
        propagation: rprivate
    - type: bind
      source: /home/ubuntu/case_analysis_web/backend/assessment_coefficients.json
      target: /app/backend/assessment_coefficients.json
      read_only: false
      bind:
        propagation: rprivate
    - type: bind
      source: /home/ubuntu/case_analysis_web/backend/assessment_manual_routes.py
