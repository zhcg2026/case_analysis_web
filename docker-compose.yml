version: '3.8'

services:
  mysql-case-analysis:
    image: mysql:8.0
    container_name: mysql-case-analysis
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-MySql@2024!Root}
      - MYSQL_DATABASE=${DB_NAME:-case_analysis}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-MySql@2024!Root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  case-analysis-app:
    build: .
    container_name: case-analysis-web
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 300 --graceful-timeout 300 backend.app:app
    ports:
      - "5001:5000"
    env_file:
      - .env.production
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/app.py:/app/backend/app.py
      - ./backend/helpers.py:/app/backend/helpers.py
      - ./backend/models.py:/app/backend/models.py
      - ./backend/models_init.py:/app/backend/models_init.py
      - ./backend/cases_helpers.py:/app/backend/cases_helpers.py
      - ./backend/cases_routes.py:/app/backend/cases_routes.py
      - ./backend/case_standards.py:/app/backend/case_standards.py
      - ./backend/case_standards_routes.py:/app/backend/case_standards_routes.py
      - ./backend/rag.py:/app/backend/rag.py
      - ./backend/kb_unified.py:/app/backend/kb_unified.py
      - ./backend/kb_common.py:/app/backend/kb_common.py
      - ./backend/auth_routes.py:/app/backend/auth_routes.py
      - ./backend/upload_routes.py:/app/backend/upload_routes.py
      - ./backend/data_management_routes.py:/app/backend/data_management_routes.py
      - ./backend/assessment_routes.py:/app/backend/assessment_routes.py
      - ./backend/assessment_coefficients.json:/app/backend/assessment_coefficients.json
      - ./backend/analysis_routes.py:/app/backend/analysis_routes.py
      - ./backend/cms_routes.py:/app/backend/cms_routes.py
      - ./backend/data_edit_routes.py:/app/backend/data_edit_routes.py
      - ./backend/knowledge_routes.py:/app/backend/knowledge_routes.py
      - ./backend/flood_routes.py:/app/backend/flood_routes.py
      - ./backend/flood_helpers.py:/app/backend/flood_helpers.py
      - ./backend/report_routes.py:/app/backend/report_routes.py
      - ./backend/tools_routes.py:/app/backend/tools_routes.py
      - ./backend/kb_routes.py:/app/backend/kb_routes.py
      - ./backend/map_routes.py:/app/backend/map_routes.py
      - ./backend/video_report.py:/app/backend/video_report.py
      - ./frontend/dist:/app/frontend/dist
      - ./frontend/public/data:/app/frontend/public/data
    depends_on:
      mysql-case-analysis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - default
      - milvus

networks:
  milvus:
    external: true

volumes:
  mysql-data:
