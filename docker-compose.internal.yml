version: '3.8'

services:
  case-analysis-app:
    build: .
    container_name: case-analysis-web
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 300 --graceful-timeout 300 backend.app:app
    ports:
      - "5001:5000"
    env_file:
      - .env.production
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/app.py:/app/backend/app.py
      - ./backend/cases_helpers.py:/app/backend/cases_helpers.py
      - ./backend/cases_routes.py:/app/backend/cases_routes.py
      - ./frontend/dist:/app/frontend/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  default:
    external: true
    name: backend_default